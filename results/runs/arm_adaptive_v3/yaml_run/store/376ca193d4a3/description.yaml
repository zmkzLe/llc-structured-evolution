name: mj_confidence_feedback_loop
doc: >
  Introduces a new sampler training mechanism, `train_on_match_with_feedback`, to provide direct feedback to the confidence table. On a sampler hit, the actual reuse distance is compared to the predicted reuse distance (stored at insertion time) to determine if the prediction was accurate, allowing for both incrementing and decrementing confidence. This aims to improve prediction accuracy and reduce `wrong_bypass` and `kept_dead` errors. State is rebalanced to stay within budget by reducing table sizes and sampler ways.

state:
  - name: etr
    scope: per_line
    kind: signed
    width: 5
    init: 0
  - name: etr_clock
    scope: per_set
    kind: counter
    width: 4
    init: 8
  - name: set_clock
    scope: per_set
    kind: counter
    width: 8
    init: ZERO

victim:
  key: etr
  extremum: max_magnitude
  tie_break: prefer_negative
  on_search: none
  bypass_when:
    - incoming_rank_gt_threshold: {rdp_table: rdp, conf_table: rdp_conf, index: pc_sig, div: 8, scale: 2, max_etr: 11, threshold: 10}
    - incoming_rank_exceeds_victim: {rdp_table: rdp, conf_table: rdp_conf, index: pc_sig, div: 8, scale: 2, max_etr: 11}

signatures:
  - name: pc_sig
    source: ip
    fold: [hit, prefetch]
    hash: crc3
    low_bits: 10 # Reduced from 11 to save space

tables:
  - name: rdp
    scope: global
    kind: saturating
    entries: 1024 # Reduced from 2048
    width: 7
    max: 95
    unset: true
  - name: rdp_conf
    scope: global
    kind: saturating
    entries: 1024 # Reduced from 2048
    width: 2
    init: ZERO

samplers:
  - name: sampled_cache
    scope: global
    sets: {mirror: 32}
    extra_index_bits: 4
    ways: 4 # Reduced from 5 to save space
    tag_bits: 10
    fields:
      - {name: signature, kind: counter, width: 10, init: ZERO} # Width matches pc_sig.low_bits
      - {name: timestamp, kind: counter, width: 8, init: ZERO}
      - {name: predicted_rdp, kind: counter, width: 7, init: ZERO} # New field to store prediction
    age: {clock: set_clock, stamp: timestamp}
    victim: {key: age, extremum: max, tie_break: first, prefer_free: true}
    on_match:
      - when: {counter: {counter: age, cmp: gt, threshold: 95}}
        stop: true
      - when: {type_in: [PREFETCH]}
        train_on_match_with_feedback: {rdp_table: rdp, conf_table: rdp_conf, index: signature, predicted_rdp: predicted_rdp, actual_rd: age, scale: 2, min_diff: 16, accuracy_threshold: 16}
        free: true
        stop: true
      - train_on_match_with_feedback: {rdp_table: rdp, conf_table: rdp_conf, index: signature, predicted_rdp: predicted_rdp, actual_rd: age, scale: 1, min_diff: 16, accuracy_threshold: 16}
        free: true
    sweep:
      - when: {counter: {counter: age, cmp: gt, threshold: 95}}
        train: {table: rdp, index: signature, op: increment}
      - when: {counter: {counter: age, cmp: gt, threshold: 95}}
        train: {table: rdp_conf, index: signature, op: decrement}
        free: true
    on_replace:
      - train: {table: rdp, index: signature, op: increment}
      - train: {table: rdp_conf, index: signature, op: decrement}
    install:
      signature: {signature: pc_sig}
      timestamp: {read: set_clock}
      predicted_rdp: {table: rdp, index: pc_sig, div: 1} # Store prediction on install
    after:
      - set: {set_clock: {add: 1}}

procedures:
  access:
    - sample: sampled_cache
    - when: {counter: {counter: etr_clock, cmp: eq, threshold: 8}}
      each_way:
        except_touched: true
        when: {counter: {counter: etr, cmp: lt, threshold: 11, abs: true}}
        set: {etr: {add: -1}}
    - when: {counter: {counter: etr_clock, cmp: eq, threshold: 8}}
      set: {etr_clock: {const: 0}}
    - set: {etr_clock: {add: 1}}
    - set:
        etr:
          unified_etr_rank:
            rdp_table: rdp
            conf_table: rdp_conf
            index: pc_sig
            div: 8
            scale: 2
            max_etr: 11

on_hit:
  - when: {type_in: [WRITE]}
    stop: true
  - run: access

on_fill:
  - when: {type_in: [WRITE]}
    set: {etr: {const: -11}}
    stop: true
  - run: access
