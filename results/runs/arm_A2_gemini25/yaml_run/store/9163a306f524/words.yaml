- name: pred_exceeds_robust_victim_etr
  place: condition
  params:
    table: table
    index: signature
    div: {int: [1, 1024]}
  means: >
    Calculates a predicted ETR for the incoming line as floor(table[index] / div).
    Finds the absolute value of the 'etr' field of the victim line ('victim_etr').
    Calculates the integer average of the absolute values of the 'etr' field across
    all valid resident lines in the set ('avg_etr').
    Calculates a blended threshold as the integer average of 'avg_etr' and 'victim_etr'.
    The final threshold for comparison is the maximum of 'victim_etr' and the blended threshold.
    The condition is true if the predicted ETR is greater than this final threshold.
    If the table entry is absent, the predicted ETR is 0, and the condition is false.
    The 'etr' field must be a per_line state field. This can only be used in 'bypass_when'.