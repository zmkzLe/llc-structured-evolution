- name: rdp_and_conf_gt
  place: condition
  params: {rdp_tbl: table, conf_tbl: table, sig: signature, rdp_thresh: {int: [0, 127]}, conf_thresh: {int: [0, 3]}}
  means: >
    True if the entry for the signature 'sig' in table 'rdp_tbl' is present and its value is greater than 'rdp_thresh',
    AND the entry for 'sig' in table 'conf_tbl' is present and its value is greater than or equal to 'conf_thresh'.
    False otherwise.