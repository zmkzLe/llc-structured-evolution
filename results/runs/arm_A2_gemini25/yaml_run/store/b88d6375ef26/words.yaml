- name: pred_exceeds_avg_resident_etr
  place: condition
  params:
    table: table
    index: signature
    div: {int: [1, 1024]}
  means: >
    Calculates a predicted ETR for the incoming line as floor(table[index] / div).
    Calculates the integer average of the absolute values of the 'etr' field across
    all valid resident lines in the set. The condition is true if the predicted ETR
    is greater than this average. If the table entry for the index is absent, the
    predicted ETR is 0, and the condition is false. The 'etr' field must be a per_line state field.