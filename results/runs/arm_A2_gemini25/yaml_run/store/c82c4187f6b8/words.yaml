- name: pred_exceeds_max_resident_etr
  place: condition
  params:
    div:
      int: [1, 1024]
    index: signature
    table: table
  means: >
    Calculates a predicted ETR for the incoming line as floor(table[index] / div).
    Finds the maximum absolute value of the 'etr' field across all valid resident lines in the set.
    The condition is true if the predicted ETR is greater than this maximum absolute ETR.
    If the table entry for the index is absent, the predicted ETR is 0, and the condition is false.
    The 'etr' field must be a per_line state field.