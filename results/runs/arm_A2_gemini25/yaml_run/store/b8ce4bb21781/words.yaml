- name: pred_exceeds_victim_with_margin
  place: condition
  params:
    div:
      int: [1, 1024]
    index: signature
    margin:
      int: [0, 11]
    table: table
  means: >
    Calculates a predicted ETR for the incoming line as floor(table[index] / div).
    Finds the absolute value of the 'etr' field of the victim line ('abs_victim_etr').
    The condition is true if the predicted ETR is greater than 'abs_victim_etr' plus the margin.
    If the table entry for the index is absent, the predicted ETR is 0, and the condition is false.
    The 'etr' field must be a per_line state field.