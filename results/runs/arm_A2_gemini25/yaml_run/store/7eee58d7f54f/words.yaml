- name: pred_worse_than_avg_and_victim
  place: condition
  params:
    table: table
    index: signature
    div: {int: [1, 1024]}
  means: >
    Calculates a predicted ETR for the incoming line as floor(table[index] / div).
    Calculates the integer average of the absolute values of the 'etr' field across
    all valid resident lines in the set. Finds the absolute value of the 'etr' field
    of the victim line chosen by the victim search. The condition is true if the
    predicted ETR is greater than this average AND greater than the victim's absolute ETR.
    If the table entry is absent, the predicted ETR is 0, and the condition is false.
    The 'etr' field must be a per_line state field. This condition can only be used in 'bypass_when'.