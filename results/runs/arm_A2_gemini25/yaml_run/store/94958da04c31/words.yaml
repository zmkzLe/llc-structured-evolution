- name: pred_exceeds_victim_by_margin
  place: condition
  params:
    table: table
    index: signature
    div: {int: [1, 1024]}
    margin: {int: [0, 127]}
  means: >
    Calculates a predicted ETR for the incoming line as floor(table[index] / div).
    The victim way must have been selected. Reads the absolute value of the 'etr'
    field of the victim way. The condition is true if the predicted ETR is strictly
    greater than the victim's absolute ETR plus the margin. If the table entry for
    the index is absent, the predicted ETR is 0, and the condition is evaluated with
    this value. The 'etr' field must be a per_line state field. This can only be
    used in 'bypass_when'.