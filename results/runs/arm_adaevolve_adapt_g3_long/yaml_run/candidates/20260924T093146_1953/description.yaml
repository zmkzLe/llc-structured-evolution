name: mockingjay_budget_realloc
doc: >
  Applies strict metadata budget reallocation. Reduces RDP to 6 bits (max 63)
  and sampler ways to 4 to free up ~2.1 KB. Channels recovered budget into a
  new 3-bit saturating hit_table (2048 entries) that tracks PC hit frequencies.
  To fix wrong_bypass on mcf/lbm/GemsFDTD, bypass is disabled for PCs with high
  hit confidence (hit_table >= 4) using a new hit_rate_low condition word.
  Thresholds scaled for 6-bit RDP. Retains MurmurHash3.

state:
  - name: etr
    scope: per_line
    kind: signed
    width: 5
    init: 0
  - name: etr_clock
    scope: per_set
    kind: counter
    width: 4
    init: 8
  - name: set_clock
    scope: per_set
    kind: counter
    width: 8
    init: ZERO

victim:
  key: etr
  extremum: max_magnitude
  tie_break: prefer_negative
  on_search: none
  bypass_when:
    - {type_not_in: [TRANSLATION], table: {table: rdp, index: pc_sig, cmp: gt, threshold: 48}, hit_rate_low: {table: hit_table, index: pc_sig, threshold: 4}}
    - {type_not_in: [TRANSLATION], table: {table: rdp, index: pc_sig, cmp: gt, threshold: 37}, table_exceeds_victim: {table: rdp, index: pc_sig, div: 4}, hit_rate_low: {table: hit_table, index: pc_sig, threshold: 4}}

signatures:
  - name: pc_sig
    source: ip
    fold: [hit, prefetch]
    hash: murmur_hash
    low_bits: 11

tables:
  - name: rdp
    scope: global
    kind: saturating
    entries: 2048
    width: 6
    max: 63
    unset: true
  - name: hit_table
    scope: global
    kind: saturating
    entries: 2048
    width: 3
    max: 7
    unset: true

samplers:
  - name: sampled_cache
    scope: global
    sets: {mirror: 32}
    extra_index_bits: 4
    ways: 4
    tag_bits: 10
    fields:
      - {name: signature, kind: counter, width: 11, init: ZERO}
      - {name: timestamp, kind: counter, width: 8, init: ZERO}
    age: {clock: set_clock, stamp: timestamp}
    victim: {key: age, extremum: max, tie_break: first, prefer_free: true}
    on_match:
      - when: {counter: {counter: age, cmp: gt, threshold: 63}}
        stop: true
      - when: {type_in: [PREFETCH]}
        train: {table: rdp, index: signature, op: toward, sample: age, scale: 2, min_diff: 10}
        free: true
        stop: true
      - train: {table: rdp, index: signature, op: toward, sample: age, min_diff: 10}
        free: true
    sweep:
      - when: {counter: {counter: age, cmp: gt, threshold: 63}}
        train: {table: rdp, index: signature, op: increment}
        free: true
    on_replace:
      - train: {table: rdp, index: signature, op: increment}
    install: {signature: {signature: pc_sig}, timestamp: {read: set_clock}}
    after:
      - set: {set_clock: {add: 1}}

procedures:
  age_set:
    - sample: sampled_cache
    - when: {counter: {counter: etr_clock, cmp: eq, threshold: 8}}
      each_way:
        except_touched: true
        when: {counter: {counter: etr, cmp: lt, threshold: 15, abs: true}}
        set: {etr: {add: -1}}
    - when: {counter: {counter: etr_clock, cmp: eq, threshold: 8}}
      set: {etr_clock: {const: 0}}
    - set: {etr_clock: {add: 1}}

on_hit:
  - when: {type_in: [WRITE]}
    stop: true
  - train: {table: hit_table, index: pc_sig, op: increment}
  - run: age_set
  - when: {table: {table: rdp, index: pc_sig, cmp: absent}}
    set: {etr: {const: 0}}
    stop: true
  - when: {table: {table: rdp, index: pc_sig, cmp: gt, threshold: 48}}
    set: {etr: {const: 15}}
    stop: true
  - set: {etr: {table: rdp, index: pc_sig, div: 4}}

on_fill:
  - when: {type_in: [WRITE]}
    set: {etr: {const: -15}}
    stop: true
  - train: {table: hit_table, index: pc_sig, op: decrement}
  - run: age_set
  - when: {table: {table: rdp, index: pc_sig, cmp: absent}}
    set: {etr: {const: 8}}
    stop: true
  - when: {table: {table: rdp, index: pc_sig, cmp: gt, threshold: 48}}
    set: {etr: {const: -15}}
    stop: true
  - set: {etr: {table: rdp, index: pc_sig, div: 4}}
