name: fsm_lifecycle_rdp
doc: >
  State-Machine Lifecycle Framing. Replaces the signed magnitude ETR counter
  with a strict 5-bit saturating FSM (0=CORE_PROTECTED, 31=EVICT).
  Lines are inserted into an FSM state proportional to their RDP prediction.
  Aging strictly increments the state towards 31, eliminating the "bell curve"
  magnitude logic for a unidirectional, predictable lifecycle.
  Set dueling dynamically chooses between div 3 and div 4 for insertion state mapping.

state:
  - name: etr
    scope: per_line
    kind: saturating
    width: 5
    init: 31
  - name: etr_clock
    scope: per_set
    kind: counter
    width: 4
    init: 8
  - name: set_clock
    scope: per_set
    kind: counter
    width: 8
    init: ZERO
  - name: psel
    scope: per_cpu
    kind: saturating
    width: 10
    init: MID

victim:
  key: etr
  extremum: max
  tie_break: first
  on_search: none
  bypass_when:
    - {type_not_in: [TRANSLATION], table: {table: rdp, index: pc_sig, cmp: gt, threshold: 73}}
    - {type_not_in: [TRANSLATION], table_exceeds_victim: {table: rdp, index: pc_sig, div: 4}}

duel:
  selector: psel
  arm_a:
    set: {etr: {table: rdp, index: pc_sig, div: 4}}
  arm_b:
    set: {etr: {table: rdp, index: pc_sig, div: 3}}
  leader_a_category: 1
  leader_b_category: 0
  leader_a_delta: 1
  leader_b_delta: -1
  follower_uses_b_when: {counter: psel, cmp: gt, threshold: MAX_OVER_2}

signatures:
  - name: pc_sig
    source: ip
    fold: [hit, prefetch]
    hash: murmur_hash
    low_bits: 11

tables:
  - name: rdp
    scope: global
    kind: saturating
    entries: 2048
    width: 7
    max: 95
    unset: true

samplers:
  - name: sampled_cache
    scope: global
    sets: {mirror: 32}
    extra_index_bits: 4
    ways: 5
    tag_bits: 10
    fields:
      - {name: signature, kind: counter, width: 11, init: ZERO}
      - {name: timestamp, kind: counter, width: 8, init: ZERO}
    age: {clock: set_clock, stamp: timestamp}
    victim: {key: age, extremum: max, tie_break: first, prefer_free: true}
    on_match:
      - when: {counter: {counter: age, cmp: gt, threshold: 95}}
        stop: true
      - when: {type_in: [PREFETCH]}
        train: {table: rdp, index: signature, op: toward, sample: age, scale: 2, min_diff: 16}
        free: true
        stop: true
      - train: {table: rdp, index: signature, op: toward, sample: age, min_diff: 16}
        free: true
    sweep:
      - when: {counter: {counter: age, cmp: gt, threshold: 95}}
        train: {table: rdp, index: signature, op: increment}
        free: true
    on_replace:
      - train: {table: rdp, index: signature, op: increment}
    install: {signature: {signature: pc_sig}, timestamp: {read: set_clock}}
    after:
      - set: {set_clock: {add: 1}}

procedures:
  age_set:
    - sample: sampled_cache
    - when: {counter: {counter: etr_clock, cmp: eq, threshold: 8}}
      each_way:
        except_touched: true
        set: {etr: {add: 1}}
    - when: {counter: {counter: etr_clock, cmp: eq, threshold: 8}}
      set: {etr_clock: {const: 0}}
    - set: {etr_clock: {add: 1}}

on_hit:
  - when: {type_in: [WRITE]}
    stop: true
  - run: age_set
  - when: {type_in: [TRANSLATION]}
    set: {etr: {const: 0}}
    stop: true
  - when: {table: {table: rdp, index: pc_sig, cmp: absent}}
    set: {etr: {const: 8}}
    stop: true
  - when: {table: {table: rdp, index: pc_sig, cmp: gt, threshold: 73}}
    set: {etr: {const: 31}}
    stop: true
  - set: {etr: {table: rdp, index: pc_sig, div: 4}}

on_fill:
  - when: {type_in: [WRITE]}
    set: {etr: {const: 31}}
    stop: true
  - run: age_set
  - when: {type_in: [TRANSLATION]}
    set: {etr: {const: 0}}
    stop: true
  - when: {table: {table: rdp, index: pc_sig, cmp: absent}}
    set: {etr: {const: 16}}
    stop: true
  - when: {table: {table: rdp, index: pc_sig, cmp: gt, threshold: 73}}
    set: {etr: {const: 31}}
    stop: true
  - use_duel: true
